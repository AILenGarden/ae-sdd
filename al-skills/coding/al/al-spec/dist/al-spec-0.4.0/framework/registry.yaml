# ALSpec specification SKILL references. Each type is independently callable.
# Project entries are explicit adaptations and never imply a document pipeline.
schema_version: 2
description: Registered ALSpec DR, Story, and TestCase SKILLs discoverable by global or exact project scope
specs:
  - id: dr
    name: DR
    type: dr
    scope: global
    path: skills/dr/SKILL.md
    enabled: true
    description: Independent design requirements specification SKILL
    tags: [dr, design, architecture, global]
    metadata:
      reference_standard: standards/global/dr-writing.md
      template: templates/global/dr.md
  - id: story
    name: Story
    type: story
    scope: global
    path: skills/story/SKILL.md
    enabled: true
    description: Independent behavior Story specification SKILL
    tags: [story, behavior, acceptance, global]
    metadata:
      reference_standard: standards/global/story-writing.md
      template: templates/global/story.md
  - id: testcase
    name: TestCase
    type: testcase
    scope: global
    path: skills/testcase/SKILL.md
    enabled: true
    description: Independent executable test-case specification SKILL
    tags: [testcase, testing, evidence, global]
    metadata:
      reference_standard: standards/global/testcase-writing.md
      template: templates/global/testcase.md
  - id: life-dr
    name: life DR
    type: dr
    scope: project
    project_id: icec-cloud-life
    path: skills/life-dr/SKILL.md
    enabled: true
    description: life project DR SKILL with embedded writing/transcription rules and required template
    tags: [life, dr, project, transcription]
    metadata:
      reference_standard: standards/project/life-dr-writing.md
      template: templates/project/life-dr.md
      transcription: standards/project/life-transcription.md
  - id: life-story
    name: life Story
    type: story
    scope: project
    project_id: icec-cloud-life
    path: skills/life-story/SKILL.md
    enabled: true
    description: life project Story SKILL with embedded writing/transcription rules and required template
    tags: [life, story, project, transcription]
    metadata:
      reference_standard: standards/project/life-story-writing.md
      template: templates/project/life-story.md
      transcription: standards/project/life-transcription.md
  - id: life-testcase
    name: life TestCase
    type: testcase
    scope: project
    project_id: icec-cloud-life
    path: skills/life-testcase/SKILL.md
    enabled: true
    description: life project TestCase SKILL with embedded writing/transcription rules and required template
    tags: [life, testcase, project, transcription]
    metadata:
      reference_standard: standards/project/life-testcase-writing.md
      template: templates/project/life-testcase.md
      transcription: standards/project/life-transcription.md
