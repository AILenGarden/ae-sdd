[package]
name = "db-operator-native"
version = "3.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "db_operator_native"
path = "src/lib.rs"

[[bin]]
name = "db-operator"
path = "src/client_main.rs"
required-features = ["client"]

[[bin]]
name = "db-operator-admin"
path = "src/main.rs"
required-features = ["admin"]

[[bin]]
name = "db-operator-daemon"
path = "src/daemon_main.rs"
required-features = ["daemon"]

[features]
default = ["admin", "daemon"]
client = [
    "dep:anyhow",
    "dep:clap",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
]
service = [
    "client",
    "dep:aes-gcm",
    "dep:base64",
    "dep:chrono",
    "dep:futures-util",
    "dep:getrandom",
    "dep:libc",
    "dep:rusqlite",
    "dep:rust_decimal",
    "dep:sha2",
    "dep:sqlparser",
    "dep:sqlx",
    "dep:subtle",
    "dep:uuid",
    "dep:windows-sys",
    "dep:windows-service",
    "dep:zeroize",
]
admin = ["service", "dep:rpassword", "dep:url"]
daemon = ["service"]

[dependencies]
anyhow = { version = "1.0", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
futures-util = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
rpassword = { version = "7.4", optional = true }
rust_decimal = { version = "1.36", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
sqlparser = { version = "0.59", features = ["visitor"], optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "postgres", "chrono", "json", "rust_decimal", "uuid"], optional = true }
subtle = { version = "2.6", optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
url = { version = "2.5", optional = true }
uuid = { version = "1.10", features = ["v4"], optional = true }
zeroize = { version = "1.8", features = ["alloc"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"], optional = true }
windows-service = { version = "0.8", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.20"
toml = "0.9"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
