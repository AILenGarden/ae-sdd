<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ae-sdd · 能力管理</title>
<style>:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#1d2533;background:#f5f6f8}body{margin:0}main{max-width:1080px;padding:40px 24px;margin:auto}h1{font-size:34px;margin:8px 0}h2{font-size:20px}p{line-height:1.7}.muted{color:#667285;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:26px 0}.card{background:white;padding:24px;border:1px solid #e0e4ea;border-radius:18px;box-shadow:0 5px 20px #26364c08}.card p{min-height:48px}.id{font-family:monospace;color:#5a6b80;font-size:13px}button,a.link{display:inline-block;font:inherit;text-decoration:none;border:1px solid #cbd6e3;background:white;border-radius:9px;padding:10px 16px;cursor:pointer;color:#175fb4}button:disabled{opacity:.45;cursor:default}button.primary{background:#0878eb;color:white;border-color:#0878eb}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{white-space:pre-wrap;min-height:20px;font-size:14px}.error{color:#b42334}details summary{cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="id">AL ENGINEERING CAPABILITIES</div><h1>ae-sdd 能力管理</h1><p class="muted">选择能力，进入它自己的注册管理入口进行调整。</p><div id="registrars" class="grid">正在读取能力入口…</div><p id="status" class="status" role="status"></p><details class="card"><summary>插件安装与卸载</summary><p id="plugin-status" class="muted">点击下方按钮管理 ae-sdd 插件。</p><button id="install">安装 / 更新 ae-sdd</button> <button id="uninstall">卸载 ae-sdd</button></details></main>
<script>
let token='';const $=s=>document.querySelector(s);
async function api(path,method='GET'){const r=await fetch(path,{method,headers:{'x-ae-sdd-ui-token':token}}),d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
async function openRegistrar(item,button){button.disabled=true;$('#status').className='status';$('#status').textContent='正在打开 '+item.id+'…';try{const out=await api('/api/registrars/'+encodeURIComponent(item.id),'POST');if(out.url){const a=document.createElement('a');a.className='link';a.href=out.url;a.target='_blank';a.rel='noopener';a.textContent='进入 '+item.id+' 管理器';$('#status').replaceChildren(a);window.open(out.url,'_blank','noopener')}else $('#status').textContent=out.message}catch(e){$('#status').className='status error';$('#status').textContent=e.message}finally{button.disabled=false}}
async function init(){const session=await(await fetch('/api/session')).json();token=session.token;const data=await api('/api/registrars');$('#registrars').replaceChildren();for(const item of data.registrars){const card=document.createElement('section');card.className='card';const id=document.createElement('div');id.className='id';id.textContent=item.id;const title=document.createElement('h2');title.textContent=item.name;const desc=document.createElement('p');desc.className='muted';desc.textContent=item.description;const button=document.createElement('button');button.className=item.kind==='web'?'primary':'';button.textContent=!item.available?'入口未安装':item.kind==='web'?'打开注册管理器':item.kind==='file'?'打开注册文件（可编辑）':'查看使用说明';button.disabled=!item.available;button.onclick=()=>openRegistrar(item,button);card.append(id,title,desc,button);$('#registrars').append(card)}}
async function pluginAction(path){try{await api(path,'POST');$('#plugin-status').textContent='操作已完成'}catch(e){$('#plugin-status').textContent=e.message}}
$('#install').onclick=()=>pluginAction('/api/install');$('#uninstall').onclick=()=>{if(confirm('确认卸载 ae-sdd 插件？独立数据库服务和连接配置会保留。'))pluginAction('/api/uninstall')};
init().catch(e=>{$('#status').textContent=e.message;$('#status').className='status error'});
</script></body></html>
